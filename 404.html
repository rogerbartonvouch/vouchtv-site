<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vouch</title>
<meta name="robots" content="noindex">
<style>
  body{margin:0;background:#12100e;color:#e8e2d6;font-family:Georgia,'Times New Roman',serif;
       display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center}
  main{padding:2rem;max-width:34rem}
  .kicker{color:#b08d3f;font-size:.8rem;letter-spacing:.3em;text-transform:uppercase;margin-bottom:1rem}
  h1{font-weight:400;font-size:2rem;letter-spacing:.06em;margin:.2rem 0 1.2rem}
  .code{font-family:ui-monospace,Menlo,monospace;font-size:1.05rem;color:#e8e2d6;
        border:1px solid #b08d3f;border-radius:.4rem;padding:.7rem 1rem;display:inline-block;
        margin:1rem 0 1.6rem;word-break:break-all;user-select:all}
  p{color:#cfc6b4;line-height:1.6;font-size:1rem}
  .quiet{font-size:.85rem;color:#8a8172}
  a{color:#b08d3f;text-decoration:none}
</style>
</head>
<body>
<main id="main">
  <div class="kicker">Vouch</div>
  <h1>That page isn't here.</h1>
  <p><a href="/">vouchtv.com</a></p>
</main>
<script>
  var m = location.pathname.match(/^\/i\/([0-9a-fA-F]{32})\/?$/);
  if (m) {
    document.getElementById('main').innerHTML =
      '<div class="kicker">An invitation</div>' +
      '<h1>The seat beside theirs.</h1>' +
      '<div class="code">' + m[1].toLowerCase() + '</div>' +
      '<p>Vouch is in private beta on iPhone. If Vouch is installed, opening this link on your ' +
      'phone takes you straight in. Otherwise: install Vouch via the TestFlight invitation ' +
      'from your friend, then paste your code in the app — <em>Friends&nbsp;&rarr;&nbsp;Invite</em>.</p>' +
      '<p class="quiet">Invitations are single-use and expire after seven days.</p>';
  }
</script>
</body>
</html>
